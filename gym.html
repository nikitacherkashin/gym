<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Дневник тренировок</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--tx:var(--tg-theme-text-color,#14181f);--hint:var(--tg-theme-hint-color,#6b7280);--card:var(--tg-theme-secondary-bg-color,#f0f2f6);--ac:#5b5bf0;--acx:#fff;--ac2:rgba(91,91,240,.16);--line:rgba(127,127,127,.18);--red:#e5484d}
@media (prefers-color-scheme:dark){:root{--bg:var(--tg-theme-bg-color,#12141a);--tx:var(--tg-theme-text-color,#f1f3f7);--hint:var(--tg-theme-hint-color,#8b93a1);--card:var(--tg-theme-secondary-bg-color,#1d2029)}}
:root[data-theme="light"]{--bg:#ffffff;--tx:#14181f;--hint:#6b7280;--card:#f0f2f6}
:root[data-theme="dark"]{--bg:#12141a;--tx:#f1f3f7;--hint:#8b93a1;--card:#1d2029}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;transition:transform .12s,opacity .12s}
#app{width:100%;max-width:560px;margin:0 auto;padding:10px 16px calc(100px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 16px}
h1{font-size:30px;line-height:1.1;margin:0;letter-spacing:-.8px;font-weight:800}
.dt{margin:4px 0 0!important}
.dt::first-letter{text-transform:uppercase}
.gear{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
nav{display:flex;background:var(--card);padding:4px;border-radius:16px;margin-bottom:18px;border:1px solid var(--line)}
nav button{flex:1;border:0;background:none;color:var(--hint);font-weight:600;font-size:15px;padding:10px 4px;border-radius:12px}
nav button.on{background:var(--ac);color:var(--acx);box-shadow:0 6px 14px -6px var(--ac)}
.b{border:0;border-radius:14px;background:var(--ac);color:var(--acx);font-weight:700;padding:14px 16px;box-shadow:0 10px 20px -10px var(--ac)}
.b.full{width:100%;margin-bottom:14px}
.b.ghost{background:var(--bg);color:var(--tx);box-shadow:none;border:1px solid var(--line)}
.b.danger{background:var(--red);box-shadow:0 10px 20px -10px var(--red)}
.b:active,.tile:active,.li:active,.gear:active{transform:scale(.97)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px;min-width:0}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
h2{font-size:20px;margin:0;letter-spacing:-.3px}
h3{font-size:16px;margin:0}
.hint{color:var(--hint);font-size:14px;margin:2px 0 10px}
.set{display:flex;align-items:center;gap:10px;padding:9px 10px;margin-bottom:6px;background:var(--bg);border-radius:14px}
.set i{font-style:normal;font-weight:700;font-size:13px;width:26px;height:26px;border-radius:50%;background:var(--ac2);color:var(--ac);display:grid;place-items:center;flex:none}
.set b{flex:1;font-size:17px}
.set small{color:var(--hint);font-size:12px}
.pr{background:var(--ac);color:var(--acx);font-size:11px;font-weight:700;border-radius:8px;padding:2px 7px}
.x{border:0;background:none;color:var(--hint);font-size:16px;padding:6px 8px}
.in{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.f{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0;font-size:14px;color:var(--hint)}
.in>*,.tiles>*,.stats>*,.st>*,.li{min-width:0}
input,select{max-width:100%}
.st{display:flex;align-items:center;gap:6px;flex:1;max-width:260px;min-width:0}
.st button{width:42px;height:50px;border:0;border-radius:14px;background:var(--bg);font-size:22px;font-weight:700;flex:none}
.st input{width:0;min-width:0;flex:1;padding:0;height:50px;border:0;border-radius:14px;background:var(--bg);font-size:24px;font-weight:800;text-align:center}
.chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);padding:8px 14px;border-radius:20px;font-size:14px;font-weight:600}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.tiles{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.tile{border:1px solid var(--line);text-align:left;background:var(--card);border-radius:22px;padding:16px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.tile i{font-style:normal;font-size:30px;line-height:1}
.tile b{font-size:20px;letter-spacing:-.3px}
.tile span{display:block;color:var(--hint);font-size:12px;margin-top:2px}
.big .tile{min-height:190px;background:linear-gradient(160deg,var(--ac2),var(--card) 70%)}
.big .tile i{font-size:50px}
.big .tile b{font-size:36px;letter-spacing:-1px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:1px solid var(--line);text-align:left;background:var(--card);border-radius:16px;padding:15px;margin-bottom:8px}
.li span{color:var(--hint)}
.li.on{border-color:var(--ac)}
.li.on span{color:var(--ac);font-weight:700}
.q{width:100%;padding:13px 15px;border-radius:14px;border:1px solid var(--line);background:var(--card);margin:10px 0 14px}
select.q{margin-top:0}
#cat,#set{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom,0px));display:none;z-index:5}
#cat.on,#set.on{display:block;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(22px);opacity:0}to{transform:none;opacity:1}}
#cat>div,#set>div{max-width:560px;margin:0 auto}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.opt:first-of-type{border-top:0}
.opt.col{flex-direction:column;align-items:flex-start}
.opt .hint{margin:2px 0 0}
.sec{font-size:13px;color:var(--hint);margin:18px 4px 8px;font-weight:600}
.sw{width:52px;height:32px;border-radius:16px;border:0;background:var(--bg);position:relative;flex:none;box-shadow:inset 0 0 0 1px var(--line)}
.sw::after{content:'';position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--hint);transition:left .18s}
.sw.on{background:var(--ac)}
.sw.on::after{left:24px;background:#fff}
#rest{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;background:var(--tx);color:var(--bg);border-radius:20px;padding:10px 12px 10px 18px;display:none;align-items:center;gap:8px;z-index:6;box-shadow:0 14px 30px -10px rgba(0,0,0,.5)}
#rest.on{display:flex}
#rest b{font-size:26px;flex:1}
#rest button{border:0;border-radius:12px;padding:10px 13px;background:var(--bg);color:var(--tx);font-weight:600}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:24px;z-index:20}
#dlg.on{display:flex}
.box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;width:100%;max-width:340px}
.box p{margin:0 0 18px;font-size:17px;font-weight:600}
.box .row{display:flex;gap:10px}
.box .b{flex:1;margin:0}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--ac);color:var(--acx);padding:10px 18px;border-radius:22px;font-weight:700;z-index:9;display:none;box-shadow:0 10px 24px -8px var(--ac)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px}
.stats b{display:block;font-size:26px;letter-spacing:-.5px}
.stats span{font-size:12px;color:var(--hint)}
.ch{width:100%;height:auto;display:block}
.hist p{margin:5px 0;font-size:14px}
.empty{color:var(--hint);text-align:center;padding:34px 16px;line-height:1.5}
.em{font-size:52px;margin-bottom:8px}
</style>
</head>
<body>
<div id="app"></div>
<div id="cat"></div>
<div id="set"></div>
<div id="rest"><span>Отдых</span><b id="rt"></b><button data-a="r15">+15 с</button><button data-a="rstop">Пропустить</button></div>
<div id="dlg"><div class="box"><p id="dm"></p><div class="row"><button class="b ghost" data-a="dno">Отмена</button><button class="b danger" data-a="dyes">Да</button></div></div></div>
<div id="toast"></div>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const cs = (tg && tg.initData && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9')) ? tg.CloudStorage : null;

// Хранилище: облако Telegram, а в обычном браузере — localStorage
const store = {
  keys: () => new Promise(r => cs ? cs.getKeys((e, k) => r(e ? [] : k))
    : r(Object.keys(localStorage).filter(k => k.startsWith('gym_')).map(k => k.slice(4)))),
  get: ks => new Promise(r => {
    if (!ks.length) return r({});
    if (cs) cs.getItems(ks, (e, v) => r(e ? {} : v));
    else { const o = {}; ks.forEach(k => o[k] = localStorage.getItem('gym_' + k)); r(o); }
  }),
  set: (k, v) => new Promise(r => { if (cs) cs.setItem(k, v, () => r()); else { try { localStorage.setItem('gym_' + k, v); } catch (e) {} r(); } }),
  delMany: ks => new Promise(r => { if (!ks.length) return r(true); if (cs) cs.removeItems(ks, e => r(!e)); else { ks.forEach(k => localStorage.removeItem('gym_' + k)); r(true); } }),
  del: k => new Promise(r => { if (cs) cs.removeItem(k, () => r()); else { localStorage.removeItem('gym_' + k); r(); } })
};

// Каталог: Верх/Низ → группа → мышца → упражнения
const CAT = {
  'Верх': {
    'Грудь': {
      'Верх груди': 'Жим штанги на наклонной скамье|Жим гантелей на наклонной скамье|Разводка гантелей на наклонной скамье|Жим в Смите на наклонной скамье',
      'Середина груди': 'Жим штанги лёжа|Жим гантелей лёжа|Разводка гантелей лёжа|Сведение рук в кроссовере|Жим в тренажёре сидя',
      'Низ груди': 'Отжимания на брусьях|Жим на скамье головой вниз|Сведение в кроссовере сверху вниз'
    },
    'Спина': {
      'Широчайшие': 'Подтягивания|Тяга верхнего блока|Тяга верхнего блока узким хватом|Пуловер в блоке',
      'Середина спины': 'Тяга штанги в наклоне|Тяга гантели одной рукой|Тяга горизонтального блока|Тяга Т-грифа',
      'Трапеции': 'Шраги со штангой|Шраги с гантелями|Тяга штанги к подбородку',
      'Поясница': 'Гиперэкстензия|Становая тяга|Наклоны со штангой'
    },
    'Плечи': {
      'Передние дельты': 'Жим штанги стоя|Жим гантелей сидя|Подъём гантелей перед собой',
      'Средние дельты': 'Махи гантелей в стороны|Махи в кроссовере|Жим Арнольда',
      'Задние дельты': 'Разводка гантелей в наклоне|Обратные разведения в тренажёре|Тяга к лицу'
    },
    'Руки': {
      'Бицепс': 'Подъём штанги на бицепс|Подъём гантелей с супинацией|Молотки|Сгибания на скамье Скотта|Сгибание рук в кроссовере',
      'Трицепс': 'Французский жим|Разгибания на верхнем блоке|Жим узким хватом|Разгибание гантели из-за головы|Отжимания на брусьях узко',
      'Предплечья': 'Сгибание кистей со штангой|Разгибание кистей со штангой|Прогулка фермера'
    },
    'Корпус': {
      'Пресс': 'Скручивания|Подъём ног в висе|Планка|Скручивания на блоке',
      'Косые мышцы': 'Боковые скручивания|Русские скручивания|Наклоны с гантелью в сторону'
    }
  },
  'Низ': {
    'Ноги': {
      'Квадрицепс': 'Приседания со штангой|Жим ногами|Разгибание ног в тренажёре|Выпады|Болгарские приседания|Гакк-приседания',
      'Бицепс бедра': 'Румынская тяга|Сгибание ног лёжа|Сгибание ног сидя|Тяга на прямых ногах',
      'Приводящие': 'Сведение ног в тренажёре|Приседания сумо'
    },
    'Ягодицы': { 'Ягодичные': 'Ягодичный мостик|Хип-траст|Отведение ноги в кроссовере|Выпады назад' },
    'Икры': { 'Икроножные': 'Подъём на носки стоя|Подъём на носки в жиме ногами', 'Камбаловидные': 'Подъём на носки сидя' }
  }
};

let W = [], D = { e: [] }, tab = 't', cp = [], q = '', pe = '', rest = 0, cfg = { rest: 90, theme: 'auto', step: 2.5, auto: true, vib: true };

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = n => String(+n);
const e1 = (w, r) => r === 1 ? w : w * (1 + r / 30); // расчётный разовый максимум (формула Эпли)
const setsText = s => s.map(a => fmt(a[0]) + '×' + a[1]).join(', ');
const dstr = (id, o) => new Date(id).toLocaleDateString('ru', o || { day: 'numeric', month: 'short' });
const sameN = (a, b) => a.toLowerCase() === b.toLowerCase();
const lastTime = n => { for (const w of W) { const x = w.e.find(x => sameN(x.n, n)); if (x) return x.s; } return null; };
const best = n => { let m = 0; W.forEach(w => w.e.forEach(x => { if (sameN(x.n, n)) x.s.forEach(s => m = Math.max(m, e1(s[0], s[1]))); })); return m; };
let dlgCb = null;
const ask = (m, ok) => { $('#dm').textContent = m; dlgCb = ok; $('#dlg').classList.add('on'); };
const warn = m => (tg && tg.showAlert) ? tg.showAlert(m) : alert(m);
const hap = t => { if (!cfg.vib) return; try { t ? tg.HapticFeedback.notificationOccurred('success') : tg.HapticFeedback.impactOccurred('light'); } catch (e) {} };
const saveDraft = () => store.set('draft', JSON.stringify({ t0: D.t0, e: D.e.map(({ n, s }) => ({ n, s })) }));
function toast(m) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 2000); }

// Таймер отдыха
function startRest(s) { rest = Date.now() + s * 1000; $('#rest').classList.add('on'); tick(); }
function tick() {
  if (!rest) return;
  const s = Math.ceil((rest - Date.now()) / 1000);
  if (s <= 0) { rest = 0; $('#rest').classList.remove('on'); hap(1); toast('Отдых закончен'); return; }
  $('#rt').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
setInterval(tick, 500);

async function load() {
  const keys = await store.keys();
  const wk = keys.filter(k => k.startsWith('w_'));
  const ex = ['draft', 'cfg'].filter(k => keys.includes(k));
  const v = await store.get(wk.concat(ex));
  const p = k => { try { return JSON.parse(v[k]); } catch (e) { return null; } };
  W = wk.map(p).filter(Boolean).sort((a, b) => b.id - a.id);
  if (ex.includes('draft')) D = p('draft') || D;
  if (ex.includes('cfg')) cfg = Object.assign(cfg, p('cfg'));
  applyTheme(); render();
}

function render() {
  const T = (k, n) => `<button data-a="tab" data-t="${k}" class="${tab === k ? 'on' : ''}">${n}</button>`;
  const dt = new Date().toLocaleDateString('ru', { weekday: 'long', day: 'numeric', month: 'long' });
  let h = `<div class="top"><div><h1>Мой зал</h1><p class="hint dt">${dt}</p></div>
    <button class="gear" data-a="opensettings" aria-label="Настройки"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button></div>
    <nav>${T('t', 'Тренировка')}${T('p', 'Прогресс')}${T('h', 'История')}</nav>`;
  h += tab === 't' ? workoutView() : tab === 'p' ? progressView() : historyView();
  $('#app').innerHTML = h;
}

function workoutView() {
  let h = `<button class="b full" data-a="opencat">+ Добавить упражнение</button>`;
  if (!D.e.length) return h + `<div class="empty"><div class="em">🏋️</div>Тренировка ещё не началась.<br>Выбери упражнение в каталоге: верх или низ, группа, мышца.</div>`;
  if (D.t0) h += `<p class="hint">Идёт ${Math.max(1, Math.round((Date.now() - D.t0) / 60000))} мин</p>`;
  D.e.forEach((x, i) => {
    const l = lastTime(x.n);
    const ref = x.s.length ? x.s[x.s.length - 1] : (l ? l[0] : ['', '']);
    const w = x.w !== undefined ? x.w : ref[0], r = x.r !== undefined ? x.r : ref[1];
    h += `<section class="card"><div class="hd"><h2>${esc(x.n)}</h2>
      <button class="x" data-a="delex" data-i="${i}" aria-label="Удалить упражнение">✕</button></div>`;
    if (l) h += `<p class="hint">Прошлый раз: ${setsText(l)}</p>`;
    x.s.forEach((s, j) => {
      h += `<div class="set"><i>${j + 1}</i><b>${fmt(s[0])} кг × ${s[1]}</b>${s[2] ? '<span class="pr">рекорд</span>' : ''}
        <small>1ПМ ≈ ${Math.round(e1(s[0], s[1]))}</small>
        <button class="x" data-a="delset" data-i="${i}" data-j="${j}" aria-label="Удалить подход">✕</button></div>`;
    });
    const stp = (f, v, d) => `<label class="f">${f === 'w' ? 'Вес, кг' : 'Повторы'}<div class="st">
      <button data-a="step" data-f="${f}" data-i="${i}" data-d="-${d}">−</button>
      <input type="number" inputmode="decimal" step="${d}" min="0" data-f="${f}" data-i="${i}" value="${v}">
      <button data-a="step" data-f="${f}" data-i="${i}" data-d="${d}">+</button></div></label>`;
    h += `<div class="in">${stp('w', w, cfg.step)}${stp('r', r, 1)}</div>
      <button class="b full" style="margin:0" data-a="addset" data-i="${i}">Записать подход</button></section>`;
  });
  if (D.e.some(x => x.s.length)) h += `<button class="b full ghost" data-a="finish" style="background:var(--card)">Завершить тренировку</button>`;
  return h;
}

function progressView() {
  const names = [...new Set(W.flatMap(w => w.e.map(x => x.n)))].sort();
  if (!names.length) return `<div class="empty"><div class="em">📈</div>Графики появятся, когда ты завершишь первую тренировку.</div>`;
  if (!names.includes(pe)) pe = names[0];
  const wk = W.filter(w => Date.now() - w.id < 7 * 864e5).length;
  const prs = W.reduce((a, w) => a + w.e.reduce((b, x) => b + x.s.filter(s => s[2]).length, 0), 0);
  const pts = W.slice().reverse().map(w => {
    const x = w.e.find(x => x.n === pe);
    return x ? { id: w.id, v: Math.max(...x.s.map(s => e1(s[0], s[1]))), s: x.s } : null;
  }).filter(Boolean).slice(-20);
  let h = `<div class="stats"><div><b>${W.length}</b><span>тренировок</span></div><div><b>${wk}</b><span>за 7 дней</span></div>
    <div><b>${prs}</b><span>рекордов</span></div></div>
    <select class="q" data-f="pe">${names.map(n => `<option ${n === pe ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
    <section class="card"><h3>Расчётный максимум на 1 повтор, кг</h3>${chart(pts)}</section>`;
  pts.slice(-5).reverse().forEach(a => h += `<div class="li" style="cursor:default"><b>${dstr(a.id)}</b><span>${setsText(a.s)}</span></div>`);
  return h;
}

function chart(p) {
  if (p.length < 2) return `<p class="hint">Нужно минимум две тренировки с этим упражнением.</p>`;
  const Wd = 320, H = 150, l = 30, r = 8, t = 10, b = 22;
  const vs = p.map(a => a.v), mn = Math.min(...vs), mx = Math.max(...vs), sp = (mx - mn) || 1;
  const X = i => l + i * (Wd - l - r) / (p.length - 1), Y = v => t + (H - t - b) * (1 - (v - mn) / sp);
  const tx = (x, y, s, a) => `<text x="${x}" y="${y}" fill="var(--hint)" font-size="10" text-anchor="${a || 'start'}">${s}</text>`;
  return `<svg class="ch" viewBox="0 0 ${Wd} ${H}">${tx(0, t + 4, Math.round(mx))}${tx(0, H - b, Math.round(mn))}
    <polyline points="${p.map((a, i) => X(i) + ',' + Y(a.v)).join(' ')}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round"/>
    ${p.map((a, i) => `<circle cx="${X(i)}" cy="${Y(a.v)}" r="3.5" fill="var(--ac)"/>`).join('')}
    ${tx(l, H - 6, dstr(p[0].id))}${tx(Wd - r, H - 6, dstr(p[p.length - 1].id), 'end')}</svg>`;
}

function historyView() {
  if (!W.length) return `<div class="empty"><div class="em">🗓️</div>Пока нет тренировок. Заверши первую, и она появится здесь.</div>`;
  return W.map(w => {
    const prs = w.e.reduce((a, x) => a + x.s.filter(s => s[2]).length, 0);
    const n = w.e.reduce((a, x) => a + x.s.length, 0);
    return `<section class="card hist"><div class="hd"><h3>${dstr(w.id, { weekday: 'short', day: 'numeric', month: 'long' })}</h3>
      <button class="x" data-a="delw" data-id="${w.id}" aria-label="Удалить тренировку">✕</button></div>
      <p class="hint">${w.m ? w.m + ' мин, ' : ''}подходов: ${n}${prs ? ', рекордов: ' + prs : ''}</p>
      ${w.e.map(x => `<p><b>${esc(x.n)}:</b> ${setsText(x.s)}</p>`).join('')}</section>`;
  }).join('');
}

// Каталог упражнений
function shell() {
  $('#cat').innerHTML = `<div><div class="hd"><button class="x" data-a="cback" style="font-size:17px">‹ Назад</button>
    <button class="b" data-a="cdone">Готово</button></div><h2 id="ct" style="margin-top:8px"></h2>
    <input class="q" id="q" placeholder="Поиск или своё упражнение" autocomplete="off" value="${esc(q)}"><div id="cb"></div></div>`;
  fillCat();
}
const row = n => `<button class="li ${D.e.some(x => sameN(x.n, n)) ? 'on' : ''}" data-a="pick" data-n="${esc(n)}">${esc(n)}<span>${D.e.some(x => sameN(x.n, n)) ? '✓' : '+'}</span></button>`;
const ICO = { 'Верх': '💪', 'Низ': '🦵', 'Грудь': '🏋️', 'Спина': '🧗', 'Плечи': '🎯', 'Руки': '💪', 'Корпус': '🔥', 'Ноги': '🦵', 'Ягодицы': '🍑', 'Икры': '🦶' };
const keysL = o => Object.keys(o).join(', ').toLowerCase();
function fillCat() {
  const t = q.trim().toLowerCase();
  $('#ct').textContent = t ? 'Поиск' : cp.length ? cp.join(' › ') : 'Что тренируем?';
  let h = '';
  if (t) {
    const all = new Set(W.flatMap(w => w.e.map(x => x.n)));
    Object.values(CAT).forEach(g => Object.values(g).forEach(m => Object.values(m).forEach(s => s.split('|').forEach(n => all.add(n)))));
    const res = [...all].filter(n => n.toLowerCase().includes(t));
    h = res.map(row).join('');
    if (!res.some(n => sameN(n, q.trim()))) h += `<button class="li" data-a="pick" data-n="${esc(q.trim())}">Добавить своё: «${esc(q.trim())}»<span>+</span></button>`;
  } else if (!cp.length) {
    h = `<div class="tiles big">${Object.keys(CAT).map(k => `<button class="tile" data-a="go" data-k="${k}"><i>${ICO[k] || ""}</i><div><b>${k}</b><span>${keysL(CAT[k])}</span></div></button>`).join('')}</div>`;
  } else if (cp.length === 1) {
    h = `<div class="tiles">${Object.keys(CAT[cp[0]]).map(k => `<button class="tile" data-a="go" data-k="${k}"><i>${ICO[k] || ""}</i><div><b>${k}</b><span>${keysL(CAT[cp[0]][k])}</span></div></button>`).join('')}</div>`;
  } else if (cp.length === 2) {
    const g = CAT[cp[0]][cp[1]];
    h = Object.keys(g).map(k => `<button class="li" data-a="go" data-k="${k}">${k}<span>${g[k].split('|').length} упр. ›</span></button>`).join('');
  } else h = CAT[cp[0]][cp[1]][cp[2]].split('|').map(row).join('');
  $('#cb').innerHTML = h;
}
const closeCat = () => { $('#cat').classList.remove('on'); render(); };

// Настройки и тема
function applyTheme() {
  document.documentElement.dataset.theme = cfg.theme === 'auto' ? '' : cfg.theme;
  try {
    const c = cfg.theme === 'auto' ? 'bg_color' : (cfg.theme === 'dark' ? '#12141a' : '#ffffff');
    tg.setHeaderColor(c); tg.setBackgroundColor(c);
  } catch (e) {}
}
const saveCfg = () => store.set('cfg', JSON.stringify(cfg));
function renderSet() {
  const chips = (k, vals, labels) => `<div class="chips">${vals.map((v, n) =>
    `<button class="chip ${cfg[k] === v ? 'on' : ''}" data-a="cset" data-k="${k}" data-v="${v}">${labels ? labels[n] : v}</button>`).join('')}</div>`;
  const sw = k => `<button class="sw ${cfg[k] ? 'on' : ''}" data-a="ctog" data-k="${k}" aria-label="Переключить"></button>`;
  const opt = (t, s, c, col) => `<div class="opt ${col ? 'col' : ''}"><div><b>${t}</b>${s ? `<div class="hint">${s}</div>` : ''}</div>${c}</div>`;
  $('#set').innerHTML = `<div><div class="hd"><h1>Настройки</h1><button class="b" data-a="closeset">Готово</button></div>
    <p class="sec">ОФОРМЛЕНИЕ</p><section class="card">
      ${opt('Тема', 'Авто берёт тему из Telegram', chips('theme', ['auto', 'light', 'dark'], ['Авто', 'Светлая', 'Тёмная']), 1)}</section>
    <p class="sec">ТРЕНИРОВКА</p><section class="card">
      ${opt('Отдых между подходами', 'Секунды', chips('rest', [60, 90, 120, 180]), 1)}
      ${opt('Шаг веса', 'Кнопки − и + меняют вес на это число, кг', chips('step', [1, 2.5, 5]), 1)}
      ${opt('Запускать таймер сам', 'После каждого записанного подхода', sw('auto'))}
      ${opt('Вибрация', 'Отклик на нажатия и конец отдыха', sw('vib'))}</section>
    <p class="sec">ДАННЫЕ</p><section class="card">
      ${opt('Резервная копия', 'Скопирует все тренировки в буфер обмена', '<button class="b ghost" data-a="copy">Скопировать</button>')}
      ${opt('Очистить историю', 'Удалит все завершённые тренировки', '<button class="b danger" data-a="clear">Очистить</button>')}</section>
    <p class="hint" style="text-align:center">Данные хранятся в облаке Telegram и привязаны к твоему аккаунту.</p></div>`;
}
const tmo = (p, ms) => Promise.race([p, new Promise(r => setTimeout(() => r(false), ms))]);
async function wipe() {
  toast('Удаляю…');
  try {
    const ids = (await tmo(store.keys(), 6000) || []).filter(k => k.startsWith('w_'));
    for (let i = 0; i < ids.length; i += 40) {
      const part = ids.slice(i, i + 40);
      if (!await tmo(store.delMany(part), 6000)) for (const k of part) await tmo(store.del(k), 4000);
    }
    const left = (await tmo(store.keys(), 6000) || []).filter(k => k.startsWith('w_'));
    W = W.filter(w => left.includes('w_' + w.id));
    render(); if ($('#set').classList.contains('on')) renderSet();
    left.length ? warn('Не удалось удалить тренировок: ' + left.length + '. Попробуй ещё раз.') : toast('История очищена');
  } catch (e) { warn('Ошибка при удалении. Попробуй ещё раз.'); }
}
function copyText(t) {
  const fb = () => {
    const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Скопировано'); } catch (e) { warn('Не удалось скопировать.'); }
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => toast('Скопировано'), fb); else fb();
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b) return;
  const d = b.dataset, a = d.a, i = +d.i, j = +d.j;
  if (a === 'tab') { tab = d.t; render(); }
  else if (a === 'opencat') { cp = []; q = ''; $('#cat').classList.add('on'); $('#cat').scrollTop = 0; shell(); }
  else if (a === 'cdone') closeCat();
  else if (a === 'cback') {
    if (q) { q = ''; $('#q').value = ''; } else if (cp.length) cp.pop(); else return closeCat();
    fillCat();
  }
  else if (a === 'go') { cp.push(d.k); fillCat(); $('#cat').scrollTop = 0; }
  else if (a === 'pick') {
    if (!d.n) return;
    if (!D.e.some(x => sameN(x.n, d.n))) { D.e.push({ n: d.n, s: [] }); if (!D.t0) D.t0 = Date.now(); saveDraft(); hap(); }
    fillCat();
  }
  else if (a === 'step') {
    const inp = $(`input[data-f="${d.f}"][data-i="${i}"]`);
    let v = (parseFloat(inp.value) || 0) + parseFloat(d.d);
    v = Math.round(Math.max(d.f === 'w' ? 0 : 1, v) * 100) / 100;
    inp.value = v; D.e[i][d.f] = String(v);
  }
  else if (a === 'addset') {
    const x = D.e[i];
    const w = parseFloat($(`input[data-f="w"][data-i="${i}"]`).value), r = parseInt($(`input[data-f="r"][data-i="${i}"]`).value, 10);
    if (isNaN(w) || w < 0 || isNaN(r) || r < 1) return warn('Введи вес и число повторов.');
    const hb = best(x.n); let p = hb; x.s.forEach(s => p = Math.max(p, e1(s[0], s[1])));
    const pr = hb > 0 && e1(w, r) > p + 0.01;
    x.s.push(pr ? [w, r, 1] : [w, r]);
    delete x.w; delete x.r;
    saveDraft(); hap(); if (cfg.auto) startRest(cfg.rest); render();
    if (pr) { toast('Новый рекорд!'); hap(1); }
  }
  else if (a === 'delset') { D.e[i].s.splice(j, 1); saveDraft(); render(); }
  else if (a === 'delex') {
    const del = () => { D.e.splice(i, 1); saveDraft(); render(); };
    D.e[i].s.length ? ask('Удалить упражнение вместе с подходами?', del) : del();
  }
  else if (a === 'opensettings') { $('#set').classList.add('on'); $('#set').scrollTop = 0; renderSet(); }
  else if (a === 'closeset') { $('#set').classList.remove('on'); render(); }
  else if (a === 'cset') { cfg[d.k] = d.k === 'theme' ? d.v : +d.v; saveCfg(); applyTheme(); renderSet(); }
  else if (a === 'ctog') { cfg[d.k] = !cfg[d.k]; saveCfg(); renderSet(); }
  else if (a === 'copy') copyText(JSON.stringify({ версия: 1, настройки: cfg, тренировки: W }));
  else if (a === 'clear') ask('Удалить все завершённые тренировки? Это нельзя отменить.', wipe);
  else if (a === 'dno') { dlgCb = null; $('#dlg').classList.remove('on'); }
  else if (a === 'dyes') { const f = dlgCb; dlgCb = null; $('#dlg').classList.remove('on'); if (f) f(); }
  else if (a === 'r15') { if (rest) rest += 15000; tick(); }
  else if (a === 'rstop') { rest = 0; $('#rest').classList.remove('on'); }
  else if (a === 'finish') {
    const ex = D.e.filter(x => x.s.length).map(({ n, s }) => ({ n, s }));
    if (!ex.length) return;
    const id = Date.now(), w = { id, m: D.t0 ? Math.max(1, Math.round((id - D.t0) / 60000)) : 0, e: ex };
    const json = JSON.stringify(w);
    if (json.length > 4000) return warn('Тренировка слишком большая для сохранения. Сократи число упражнений или подходов.');
    store.set('w_' + id, json); W.unshift(w); D = { e: [] }; store.del('draft');
    rest = 0; $('#rest').classList.remove('on'); tab = 'h'; render(); toast('Тренировка сохранена'); hap(1);
  }
  else if (a === 'delw') {
    const id = +d.id;
    ask('Удалить эту тренировку?', () => { W = W.filter(w => w.id !== id); store.del('w_' + id); render(); });
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { q = t.value; fillCat(); }
  else if (t.dataset.f === 'w' || t.dataset.f === 'r') D.e[+t.dataset.i][t.dataset.f] = t.value;
});
document.addEventListener('change', e => { if (e.target.dataset.f === 'pe') { pe = e.target.value; render(); } });

load();
</script>
</body>
